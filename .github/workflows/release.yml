# GoReleaser workflow for automated binary releases.
# Triggers on version tags (v*) and creates GitHub releases.
#
# Binary: copyright
# Platforms: Linux, macOS, Windows (amd64, arm64)
#
# References:
#   - https://goreleaser.com/ci/actions/
#   - https://github.com/goreleaser/goreleaser-action

name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go modules
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests
        run: go test -race -short ./...

      - name: Install Syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify ${{ matrix.os }}
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: Linux_x86_64.tar.gz
            binary: copyright
          - os: macos-latest
            archive: Darwin_arm64.tar.gz
            binary: copyright
          - os: windows-latest
            archive: Windows_x86_64.zip
            binary: copyright.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Download and verify (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          ARCHIVE="copyright_${VERSION}_${{ matrix.archive }}"
          BASE="https://github.com/simplycubed/copyright/releases/download/${TAG}"

          curl -fsSL -o "${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -fsSL -o checksums.txt "${BASE}/checksums.txt"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --ignore-missing -c checksums.txt
          else
            grep " ${ARCHIVE}\$" checksums.txt | shasum -a 256 -c -
          fi

          tar xzf "${ARCHIVE}"
          chmod +x ${{ matrix.binary }}
          ./${{ matrix.binary }} version | grep -q "copyright" && echo "Binary verified successfully"

      - name: Download and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $archive = "copyright_${version}_${{ matrix.archive }}"
          $base = "https://github.com/simplycubed/copyright/releases/download/${tag}"

          Invoke-WebRequest -Uri "$base/$archive" -OutFile $archive
          Invoke-WebRequest -Uri "$base/checksums.txt" -OutFile checksums.txt

          $expectedLine = (Get-Content checksums.txt | Where-Object { $_ -match "\s$([regex]::Escape($archive))$" })
          if (-not $expectedLine) { throw "no checksum entry for $archive in checksums.txt" }
          $expected = ($expectedLine -split '\s+')[0].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          if ($expected -ne $actual) { throw "checksum mismatch for ${archive}: expected ${expected}, got ${actual}" }
          Write-Host "Checksum verified for $archive"

          Expand-Archive -Path $archive -DestinationPath .
          $output = & ".\${{ matrix.binary }}" version 2>&1 | Out-String
          if ($output -match "copyright") { Write-Host "Binary verified successfully" } else { exit 1 }
